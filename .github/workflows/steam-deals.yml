name: Публикация скидок Steam

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-deals
  cancel-in-progress: false

jobs:
  proverka-skidok:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить Steam и опубликовать предложения
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          STEAM_COUNTRY_CODE: ru
          STEAM_LANGUAGE: russian
          DATABASE_PATH: steam_deals.sqlite3
          MINIMUM_DISCOUNT_PERCENT: "20"
        run: python bot.py --once

      - name: Сохранить историю публикаций
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f steam_deals.sqlite3
          if git diff --cached --quiet; then
            echo "История публикаций не изменилась."
          else
            git commit -m "Обновить историю публикаций скидок Steam"
            git push
          fi
