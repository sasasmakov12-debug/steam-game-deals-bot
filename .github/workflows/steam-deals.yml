name: Публикация скидок Steam

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-deals
  cancel-in-progress: false

jobs:
  proverka-skidok:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v

      - name: Проверить Steam и опубликовать предложения
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          STEAM_COUNTRY_CODE: ru
          STEAM_LANGUAGE: russian
          DATABASE_PATH: steam_deals.sqlite3
          MINIMUM_DISCOUNT_PERCENT: "20"
          MAX_POSTS_PER_CHECK: "5"
        run: python bot.py --once

      - name: Сохранить историю публикаций
        if: always()
        run: |
          if [ ! -f steam_deals.sqlite3 ]; then
            echo "Файл истории ещё не создан."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f steam_deals.sqlite3
          if git diff --cached --quiet; then
            echo "История публикаций не изменилась."
          else
            git commit -m "Обновить историю публикаций скидок Steam"
            git push
          fi
